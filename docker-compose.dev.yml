services:
  server-api:
    build: .
    container_name: dev-server-api
    command: python manage.py runserver 0.0.0:8000
    volumes:
        - ./:/app
    ports:
        - "8000:8000"
    depends_on:
        - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
        - "6379:6379"