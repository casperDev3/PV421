services:
  server-api:
    build: .
    container_name: prod-server-api
    volumes:
        - ./:/app
    ports:
        - "8000:8000"
    depends_on:
        - redis
    restart: always
    command: daphne -b 0.0.0 -p 8000 core.asgi:application


  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
        - "6379:6379"