<!-- templates/add_item.html -->
{% extends "base.html" %}

{% block title %}Додати товар{% endblock %}

{% block content %}
    <h1>Додати новий товар</h1>
    <form method="post" style="max-width: 400px;">
        <div style="margin-bottom: 10px;">
            <label>Назва:</label><br>
            <input type="text" name="name" required style="width: 100%; padding: 5px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Ціна:</label><br>
            <input type="number" step="0.01" name="price" required style="width: 100%; padding: 5px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Категорія:</label><br>
            <select name="category" style="width: 100%; padding: 5px;">
                <option value="Електроніка">Електроніка</option>
                <option value="Література">Література</option>
                <option value="Продукти">Продукти</option>
                <option value="Інше">Інше</option>
            </select>
        </div>
        <button type="submit" style="padding: 10px 20px;">Додати</button>
    </form>
{% endblock %}
