{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}WishList{% endblock %}</title>

  <!-- NYT-ish typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --ink:#111111;
      --muted:#666666;
      --line:#e6e6e6;
      --paper:#fafafa;
      --accent:#000000;
      --radius:14px;
      --max:1100px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.55;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:0 18px; }

    /* Top masthead */
    .topbar{
      border-bottom:1px solid var(--line);
      background:var(--bg);
      position:sticky; top:0; z-index:10;
    }
    .topbar__inner{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0;
      gap:14px;
    }
    .brand{
      display:flex; flex-direction:column; gap:2px;
      min-width:220px;
    }
    .brand__name{
      font-family:"Libre Baskerville", serif;
      font-weight:700;
      letter-spacing:.2px;
      font-size:22px;
      text-transform:none;
    }
    .brand__tag{
      font-size:12px;
      color:var(--muted);
    }

    .nav{
      display:flex; gap:14px; flex-wrap:wrap;
      justify-content:center;
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
      padding:0 14px;
      flex:1;
    }
    .nav a{
      font-size:13px;
      color:var(--ink);
      padding:6px 8px;
      border-radius:10px;
      transition:background .15s ease;
    }
    .nav a:hover{ background:var(--paper); text-decoration:none; }

    .actions{
      display:flex; gap:10px; align-items:center;
      min-width:220px; justify-content:flex-end;
    }
    .pill{
      font-size:12px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      color:var(--muted);
      background:var(--paper);
    }
    .btn{
      font-size:13px;
      border:1px solid var(--ink);
      background:var(--ink);
      color:#fff;
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn.secondary{
      background:transparent;
      color:var(--ink);
      border:1px solid var(--line);
    }

    /* Layout */
    main{ padding:26px 0 60px; }

    .grid{
      display:grid;
      grid-template-columns: 1.4fr .9fr;
      gap:22px;
    }
    @media (max-width: 920px){
      .grid{ grid-template-columns:1fr; }
      .brand, .actions{ min-width:auto; }
      .nav{ border-left:0; border-right:0; padding:0; justify-content:flex-start; }
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--bg);
      overflow:hidden;
    }
    .card__head{
      padding:18px 18px 0;
    }
    .kicker{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    h1,h2,h3{
      font-family:"Libre Baskerville", serif;
      margin:10px 0 0;
      line-height:1.18;
    }
    h1{ font-size:34px; }
    h2{ font-size:20px; }
    .lede{
      margin:10px 0 0;
      color:var(--muted);
      font-size:15px;
    }

    .card__body{ padding:18px; }

    .list{
      margin:0; padding:0;
      list-style:none;
      display:flex; flex-direction:column; gap:10px;
    }
    .wish{
      display:flex; gap:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--paper);
      align-items:flex-start;
    }
    .wish__dot{
      width:10px; height:10px;
      border-radius:50%;
      background:var(--ink);
      margin-top:6px;
      flex:0 0 auto;
    }
    .wish__title{
      font-weight:600;
      margin:0;
    }
    .wish__meta{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .side{
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .mini{
      padding:16px;
    }
    .mini h3{
      font-size:16px;
      margin-top:8px;
    }
    .links{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:12px;
    }
    .linkrow{
      display:flex; justify-content:space-between; gap:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--bg);
    }
    .linkrow code{
      font-size:12px;
      color:var(--muted);
      background:transparent;
    }

    footer{
      border-top:1px solid var(--line);
      padding:18px 0;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__inner">
    <div class="brand">
      <div class="brand__name">WishList</div>
      <div class="brand__tag">Мої бажання, нотатки та плани — акуратно як у газеті</div>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/news/">News</a>
      <a href="/admin/">Admin</a>
      <a href="/api/">API</a>
    </nav>

    <div class="actions">
      <span class="pill">Env: {{ test }}</span>
      <a class="btn secondary" href="/api/auth/token/">Login</a>
      <a class="btn" href="/api/auth/register/">Sign up</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer>
  <div class="wrap">
    © {% now "Y" %} WishList · Minimal NYT-style layout · Django templates
  </div>
</footer>

</body>
</html>
